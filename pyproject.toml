[project]
name = "tkus-vis"
# Bump with /ship; move CHANGELOG.md's Unreleased notes under the new version in the same commit.
version = "0.1.0"
description = "Executive report of AI agent spend from tkus ledgers, joined with delivery output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nate Kot" }]
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "playwright>=1.63.0",
    "pypdf>=6.19.0",
    "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
tkus-vis = "tkus_vis.cli:main"

[project.urls]
Repository = "https://github.com/natekot/tkus-vis"
Issues = "https://github.com/natekot/tkus-vis/issues"
Changelog = "https://github.com/natekot/tkus-vis/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
